
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Posters</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .posters {
      display: flex;
      gap: 100px;
    }

    .posters img {
      width: 300px;
      height: auto;
      display: block;
      border-radius: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
    }
    
  </style>
</head>

<body>
  <div class="posters">
    <img src="https://image.tmdb.org/t/p/w780/xlaY2zyzMfkhk0HSC5VUwzoZPU1.jpg">
    <img src="https://image.tmdb.org/t/p/w780/yQvGrMoipbRoddT0ZR8tPoR7NfX.jpg">
  </div>
</body>
</html>
