
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Posters</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .posters {
      display: flex;
      gap: 100px;
    }

    .posters img {
      width: 300px;
      height: auto;
      display: block;
      border-radius: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div class="posters">
    <img id="poster1">
    <img id="poster2">
  </div>

  <script>
    async function loadMovies() {
      const response = await fetch("./movies_data.json");
      const movies = await response.json();

      const movieList = Object.values(movies);

      // Pick two different random movies
      const firstIndex = Math.floor(Math.random() * movieList.length);

      let secondIndex;
      do {
        secondIndex = Math.floor(Math.random() * movieList.length);
      } while (secondIndex === firstIndex);

      document.getElementById("poster1").src = movieList[firstIndex].poster;
      document.getElementById("poster2").src = movieList[secondIndex].poster;
    }

    loadMovies();
  </script>
</body>
</html>
