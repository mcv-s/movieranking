
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Posters</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .posters {
      display: flex;
      gap: 100px;
    }

    .movie {
      text-align: center;
    }

    .movie img {
      width: 300px;
      height: auto;
      display: block;
      border-radius: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
    }

    .movie-name {
      margin-top: 15px;
      font-size: 24px;
      font-weight: bold;
      margin-top: 30px;
      font-family: 'Courier New', Courier, monospace;
    }
  </style>
</head>

<body>
  <div class="posters">

    <div class="movie">
      <img id="poster1">
      <div class="movie-name" id="name1">M1</div>
    </div>

    <div class="movie">
      <img id="poster2">
      <div class="movie-name" id="name2">M2</div>
    </div>

  </div>

  <script>
    const request = new XMLHttpRequest();

    request.open(
      "GET",
      "https://raw.githubusercontent.com/mcv-s/movieranking/2f93d77edc1de12714ee808346384827ff0decde/movies_data.json",
      false
    );

    request.send();

    const movies = JSON.parse(request.responseText);

    // Keep the movie name along with its data
    const movieList = Object.entries(movies);

    // Pick two different random movies
    const firstIndex = Math.floor(Math.random() * movieList.length);

    let secondIndex;
    do {
      secondIndex = Math.floor(Math.random() * movieList.length);
    } while (secondIndex === firstIndex);

    const firstMovie = movieList[firstIndex];
    const secondMovie = movieList[secondIndex];

    // Display posters
    document.getElementById("poster1").src = firstMovie[1].poster;
    document.getElementById("poster2").src = secondMovie[1].poster;

    // Display names
    document.getElementById("name1").textContent = firstMovie[0];
    document.getElementById("name2").textContent = secondMovie[0];
  </script>



</body>
</html>
